name: godot

# The Godot game (docs/architecture/godot-architecture.md, section 6). Jobs:
# - changes: decides whether the Godot checks and the frozen-Python guard apply;
# - frozen-python: a pull request that changes a file under hexa/ fails (hexa/ is frozen at v0.2.2, the reference);
# - checks: the lint (layers, size limits, UI style rules), Python UI bake check, import, script parse, generated
#   theme/tileset/map checks, main scene start (app.tscn), and the GUT tests (on pull requests and pushes that touch
#   godot/, tools/ or this workflow);
# - ui-shots: on pull requests touching shell UI/input or by hand, renders UI pictures (1x & 2x) and checks UI budgets under xvfb;
# - perf: nightly and by hand, tools/perf_map.gd on the made-up Europe map with the full tileset (m1-build-spec section 9), then
#   tools/perf_core.gd (headless) on the same size of world: the season, the stats, a save and a load (m3-build-spec section 8);
# - export-windows and smoke-windows: on a tag v0.3.*, or by hand, the Windows zip and a smoke start on a Windows runner.
# The 0.3.0 map job (rebuild of europe_1480.json) is gone with that map (M0, step R3). A check of the committed map
# file against its builder comes back with the new map file (architecture section 4.2); the goldens come with M1.

on:
  workflow_dispatch:      # a playtest build of master: the Windows zip without a tag (and the speed job)
  schedule:
    - cron: "41 3 * * *"  # the nightly speed job (perf) only
  pull_request:
  push:
    branches: ["**"]
    tags: ["v0.3.*"]

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: what changed
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      godot: ${{ steps.changes.outputs.godot }}
      hexa: ${{ steps.changes.outputs.hexa }}
      ui_shots: ${{ steps.changes.outputs.ui_shots }}
    steps:
      # The whole history, so that the merge base with the target branch can be found.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find what changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          IS_TAG: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi
          # Without a known base the Godot checks run; the frozen-Python guard only needs pull requests, which always have one.
          godot=true
          hexa=false
          ui_shots=true
          if [ -n "$base" ]; then
            changed=$(git diff --name-only "$base" HEAD)
            if grep -q '^hexa/' <<< "$changed"; then hexa=true; fi
            if grep -qE '^(godot/|tools/|\.github/workflows/godot\.yml|\.github/actions/setup-godot/)' <<< "$changed"; then
              godot=true
            else
              godot=false
            fi
            if grep -qE '^(godot/shell/(app|ui|hud|screens|input)/|godot/tools/ui/|godot/tests/perf_ui_budget\.json|\.github/workflows/godot\.yml)' <<< "$changed"; then
              ui_shots=true
            else
              ui_shots=false
            fi
          fi
          if [ "$IS_TAG" = "true" ]; then
            godot=true
            ui_shots=true
          fi
          echo "godot=$godot" >> "$GITHUB_OUTPUT"
          echo "hexa=$hexa" >> "$GITHUB_OUTPUT"
          echo "ui_shots=$ui_shots" >> "$GITHUB_OUTPUT"
          echo "base=${base:-none} godot=$godot hexa=$hexa ui_shots=$ui_shots"

  frozen-python:
    name: hexa/ stays frozen
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse changes under hexa/
        env:
          HEXA_CHANGED: ${{ needs.changes.outputs.hexa }}
        run: |
          if [ "$HEXA_CHANGED" = "true" ]; then
            echo "::error::This pull request changes a file under hexa/. The Python game is frozen at v0.2.2 (docs/architecture/godot-architecture.md, section 8): fix it in godot/, or ask for the freeze to be lifted first."
            exit 1
          fi
          echo "No change under hexa/."

  checks:
    name: lint, import, scripts, GUT
    needs: changes
    if: needs.changes.outputs.godot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120   # the GUT suite alone takes about an hour
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12 (UI bake checks)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/requirements-bake.txt
      - name: Install UI bake dependencies
        run: python -m pip install -r tools/requirements-bake.txt
      - name: Set up Godot
        uses: ./.github/actions/setup-godot
      # Every step that prints to the log is also checked for the engine's error and warning lines: the
      # exit status alone misses some script errors. Warnings are errors in project.godot.
      # Warm-up: on a fresh checkout there is no .godot/imported cache, and the first --import loads the custom
      # theme (project.godot theme/custom) before its fonts and PNGs are imported, which logs cannot-open /
      # failed-loading errors. The output is discarded; the pass after it runs against a populated cache.
      - name: Warm up the import cache (output discarded)
        run: '"$GODOT" --headless --path godot --import > /dev/null 2>&1 || true'
      - name: Import the project (fails on any script error or warning)
        run: |
          set -uo pipefail
          "$GODOT" --headless --path godot --import 2>&1 | tee import.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'ERROR|WARNING' import.log; then
            echo "::error::The import reported errors or warnings (see the log)."
            exit 1
          fi
      - name: Lint (layers, size limits, core/ rules, luck, Godot 3 spellings, Studiolo UI style)
        run: python tools/lint_godot.py godot
      - name: UI bake check and unit tests (bake_ui --check)
        run: |
          python tools/bake_ui.py --check
          HEXA_REQUIRE_BAKE=1 python -m unittest tests/test_bake_ui.py
      - name: Load every script (parse errors and warnings)
        run: |
          set -uo pipefail
          "$GODOT" --headless --path godot --script res://tools/check_scripts.gd 2>&1 | tee scripts.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error|check_scripts: cannot' scripts.log; then
            echo "::error::A script does not parse (see the log)."
            exit 1
          fi
      - name: Open the main scene headless (app.tscn)
        run: |
          set -uo pipefail
          "$GODOT" --headless --path godot --quit 2>&1 | tee main.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|ERROR' main.log; then
            echo "::error::The main scene did not open cleanly (see the log)."
            exit 1
          fi
      # The generated files must be current: the Themes, the four TileSets (assets/tiles/tiles_<season>.tres), the north Italy map, and the scenarios.
      - name: Generated Themes are current (build_theme --check)
        run: |
          set -uo pipefail
          "$GODOT" --headless --path godot -s res://tools/build_theme.gd -- --check 2>&1 | tee theme.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error|ERROR' theme.log; then
            echo "::error::Committed Theme files or font checks failed tools/build_theme.gd --check: run tools/build_theme.gd and commit the files."
            exit 1
          fi
      - name: Generated tile-window tab index is current (build_tile_tabs --check)
        run: |
          set -uo pipefail
          "$GODOT" --headless --path godot -s res://tools/build_tile_tabs.gd -- --check 2>&1 | tee tile_tabs.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error|ERROR' tile_tabs.log; then
            echo "::error::tile_tabs_index.gd is stale or failed tools/build_tile_tabs.gd --check: run the tool and commit the file."
            exit 1
          fi
      - name: Generated TileSets are current (build_tileset --check)
        run: |
          set -uo pipefail
          "$GODOT" --headless --path godot -s res://tools/build_tileset.gd -- --check 2>&1 | tee tileset.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error' tileset.log; then
            echo "::error::A committed assets/tiles/tiles_*.tres differs from what tools/build_tileset.gd builds: run it and commit the files."
            exit 1
          fi
      - name: Generated map is current (build_map --check)
        run: |
          set -uo pipefail
          "$GODOT" --headless --path godot -s res://tools/build_map.gd -- --check 2>&1 | tee map.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error' map.log; then
            echo "::error::The committed map file differs from what tools/build_map.gd builds: run it and commit the file."
            exit 1
          fi
      - name: Generated scenarios are current (build_scenario --check)
        run: |
          set -uo pipefail
          "$GODOT" --headless --path godot -s res://tools/build_scenario.gd -- --check 2>&1 | tee scenario.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error' scenario.log; then
            echo "::error::Committed scenario files differ from what tools/build_scenario.gd builds or fail validation: run it and commit the files."
            exit 1
          fi
      - name: GUT tests (headless, JUnit report)
        # The random-play tests run in groups, each in its own process: in one process with the rest they run the
        # runner out of memory.
        run: |
          set +e
          set -uo pipefail
          fail=0
          gut() {  # a name for the run, then GUT's options
            local name=$1; shift
            "$GODOT" --headless --path godot -s res://addons/gut/gut_cmdln.gd "$@" -gexit \
              -gjunit_xml_file="$RUNNER_TEMP/gut-junit-$name.xml" 2>&1 | tee "gut-$name.log"
            local status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ] || grep -q 'SCRIPT ERROR' "gut-$name.log"; then
              echo "::error::GUT reported a failing test or a script error in the $name run (see the log)."
              fail=1
            fi
          }
          rest=$(cd godot && find tests -name 'test_*.gd' ! -name test_ui_monkey.gd | LC_ALL=C sort | sed 's#^#res://#' | paste -sd,)
          gut main -gtest="$rest"
          for group in seed_148 seed_149 seed_150 seed_151 mouse_click; do
            gut "monkey-$group" -gtest=res://tests/shell/test_ui_monkey.gd -gunit_test_name="$group"
          done
          want=$(grep -c '^func test_' godot/tests/shell/test_ui_monkey.gd)
          ran=$(cat gut-monkey-*.log | sed 's/\x1b\[[0-9;]*m//g' | awk '$1=="Tests"{n+=$2} END{print n+0}')
          if [ "$ran" -ne "$want" ]; then
            echo "::error::The random-play groups ran $ran of $want tests: add the missing names to the groups."
            fail=1
          fi
          exit $fail
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Godot checks"
            echo
            echo "- Import, script load and main scene: see the step logs."
            for report in "$RUNNER_TEMP"/gut-junit-*.xml; do
              if [ -f "$report" ]; then
                echo "- GUT (JUnit, $(basename "$report" .xml)): \`$(grep -o '<testsuites[^>]*>' "$report" | head -1)\`"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-junit
          path: ${{ runner.temp }}/gut-junit-*.xml
          if-no-files-found: ignore

  # The speed job: no GPU on the runner, so the window is Mesa's software OpenGL (llvmpipe) under xvfb. Frame times
  # are reported, not enforced (tests/perf_budget.json: class gpu; run `--gpu-limits` on real hardware). The CPU limits
  # (fill, season swap, chunk rebuild, one build) and the memory limits fail the job; the runner is about twice as slow
  # as the PC the limits were read on, hence --cpu-scale.
  perf:
    name: map speed (fake Europe)
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot
        uses: ./.github/actions/setup-godot
      - name: Software OpenGL and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-utils
      # Warm-up (see the lint job): on a fresh checkout there is no .godot/imported cache, and the first --import loads the custom
      # theme (project.godot theme/custom) before its fonts and PNGs are imported, which logs cannot-open /
      # failed-loading errors. The output is discarded; the pass after it runs against a populated cache.
      - name: Warm up the import cache (output discarded)
        run: '"$GODOT" --headless --path godot --import > /dev/null 2>&1 || true'
      - name: Import the project
        run: |
          "$GODOT" --headless --path godot --import > import.log 2>&1 || { cat import.log; exit 1; }
      - name: Measure (section 9 table in the job summary)
        run: |
          set -uo pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT" --path godot --rendering-driver opengl3             -s res://tools/perf_map.gd -- --cpu-scale=2.0 --out="$RUNNER_TEMP/perf.json" --summary="$GITHUB_STEP_SUMMARY" 2>&1 | tee perf.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::The map is over a CPU or memory limit of godot/tests/perf_budget.json (see the job summary)."
            exit 1
          fi
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-map
          path: ${{ runner.temp }}/perf.json
          if-no-files-found: ignore
      - name: Measure the core (m3-build-spec section 8 table in the job summary)
        run: |
          set -uo pipefail
          "$GODOT" --headless --path godot -s res://tools/perf_core.gd -- --cpu-scale=2.0 --out="$RUNNER_TEMP/perf_core.json" --summary="$GITHUB_STEP_SUMMARY" 2>&1 | tee perf_core.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error' perf_core.log; then
            echo "::error::The core is over a limit of godot/tests/perf_core_budget.json (see the job summary)."
            exit 1
          fi
      - name: Keep the core numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-core
          path: ${{ runner.temp }}/perf_core.json
          if-no-files-found: ignore

  ui-shots:
    name: UI pictures and perf (xvfb)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.ui_shots == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot
        uses: ./.github/actions/setup-godot
      - name: Software OpenGL and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-utils
      # Warm-up (see the lint job): on a fresh checkout there is no .godot/imported cache, and the first --import loads the custom
      # theme (project.godot theme/custom) before its fonts and PNGs are imported, which logs cannot-open /
      # failed-loading errors. The output is discarded; the pass after it runs against a populated cache.
      - name: Warm up the import cache (output discarded)
        run: '"$GODOT" --headless --path godot --import > /dev/null 2>&1 || true'
      - name: Import the project
        run: |
          "$GODOT" --headless --path godot --import > import.log 2>&1 || { cat import.log; exit 1; }
      - name: Render UI screen pictures (1x and 2x)
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/ui-shots"
          xvfb-run -a -s "-screen 0 2560x1440x24" "$GODOT" --path godot --rendering-driver opengl3 \
            -s res://tools/ui/shot_ui.gd -- --out="$RUNNER_TEMP/ui-shots" 2>&1 | tee shot_ui.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error' shot_ui.log; then
            echo "::error::tools/ui/shot_ui.gd failed (see the log)."
            exit 1
          fi
      - name: Measure UI frame & memory budgets (perf_ui)
        run: |
          set -uo pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT" --path godot --rendering-driver opengl3 \
            -s res://tools/ui/perf_ui.gd -- --cpu-scale=2.0 --out="$RUNNER_TEMP/perf_ui.json" --summary="$GITHUB_STEP_SUMMARY" 2>&1 | tee perf_ui.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error' perf_ui.log; then
            echo "::error::tools/ui/perf_ui.gd exceeded a CPU or memory limit (see the job summary)."
            exit 1
          fi
      - name: Keep UI pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore
      - name: Keep UI perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-ui
          path: ${{ runner.temp }}/perf_ui.json
          if-no-files-found: ignore

  # The soak (m8-build-spec section 4.17): all-AI games with the invariants every season. Six runs: the `ai` suite in four shards of
  # 25 seeds, `passive` and `europe`; each uploads its JSON; soak-ranges judges the `ai` ranges over the 100 games.
  soak:
    name: soak (${{ matrix.suite }} ${{ matrix.seeds }})
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: ai, seeds: "1-25", seasons: 80, name: ai-1}
          - {suite: ai, seeds: "26-50", seasons: 80, name: ai-2}
          - {suite: ai, seeds: "51-75", seasons: 80, name: ai-3}
          - {suite: ai, seeds: "76-100", seasons: 80, name: ai-4}
          - {suite: passive, seeds: "1-20", seasons: 80, name: passive}
          - {suite: europe, seeds: "1-4", seasons: 40, name: europe}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot
        uses: ./.github/actions/setup-godot
      - name: Warm up the import cache (output discarded)
        run: '"$GODOT" --headless --path godot --import > /dev/null 2>&1 || true'
      - name: Import the project
        run: |
          "$GODOT" --headless --path godot --import > import.log 2>&1 || { cat import.log; exit 1; }
      - name: Play the games (tables in the job summary)
        run: |
          set -uo pipefail
          "$GODOT" --headless --path godot -s res://tools/soak.gd -- --suite=${{ matrix.suite }} --seeds=${{ matrix.seeds }} \
            --seasons=${{ matrix.seasons }} --out="$RUNNER_TEMP/soak-${{ matrix.name }}.json" --summary="$GITHUB_STEP_SUMMARY" 2>&1 | tee soak.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error' soak.log; then
            echo "::error::The soak found a broken invariant, an error or a range out of range (see the job summary; a failed game prints its replay line)."
            exit 1
          fi
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ matrix.name }}
          path: ${{ runner.temp }}/soak-${{ matrix.name }}.json
          if-no-files-found: ignore

  soak-ranges:
    name: soak ranges (ai, 100 games)
    needs: soak
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot
        uses: ./.github/actions/setup-godot
      - name: Warm up the import cache (output discarded)
        run: '"$GODOT" --headless --path godot --import > /dev/null 2>&1 || true'
      - name: Import the project
        run: |
          "$GODOT" --headless --path godot --import > import.log 2>&1 || { cat import.log; exit 1; }
      - name: Download the four ai reports
        uses: actions/download-artifact@v4
        with:
          pattern: soak-ai-*
          path: ${{ runner.temp }}/soak
          merge-multiple: true
      - name: Judge the ai ranges over the 100 games
        run: |
          set -uo pipefail
          "$GODOT" --headless --path godot -s res://tools/soak.gd -- \
            --merge="$RUNNER_TEMP/soak/soak-ai-1.json,$RUNNER_TEMP/soak/soak-ai-2.json,$RUNNER_TEMP/soak/soak-ai-3.json,$RUNNER_TEMP/soak/soak-ai-4.json" \
            --summary="$GITHUB_STEP_SUMMARY" 2>&1 | tee ranges.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE 'SCRIPT ERROR|Parse Error' ranges.log; then
            echo "::error::An expected range of the ai suite is broken (see the job summary)."
            exit 1
          fi

  export-windows:
    name: Windows zip (tag)
    needs: [changes, checks]
    if: startsWith(github.ref, 'refs/tags/v0.3.') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot
        uses: ./.github/actions/setup-godot
      # Warm-up (see the lint job): on a fresh checkout there is no .godot/imported cache, and the first --import loads the custom
      # theme (project.godot theme/custom) before its fonts and PNGs are imported, which logs cannot-open /
      # failed-loading errors. The output is discarded; the pass after it runs against a populated cache.
      - name: Warm up the import cache (output discarded)
        run: '"$GODOT" --headless --path godot --import > /dev/null 2>&1 || true'
      - name: Import the project
        run: |
          "$GODOT" --headless --path godot --import > import.log 2>&1 || { cat import.log; exit 1; }
      - name: Export the Windows Desktop preset (release, 64-bit, data packed into the exe)
        run: |
          set -uo pipefail
          mkdir -p godot/build
          "$GODOT" --headless --path godot --export-release "Windows Desktop" "$GITHUB_WORKSPACE/godot/build/Hexa.exe" 2>&1 | tee export.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || [ ! -f godot/build/Hexa.exe ]; then
            echo "::error::The Windows export failed (see the log)."
            exit 1
          fi
      - name: Zip the build with its credits
        run: |
          set -euo pipefail
          mkdir -p dist/Hexa
          cp godot/build/Hexa.exe godot/CREDITS.md dist/Hexa/
          (cd dist && zip -r "../Hexa-${GITHUB_REF_NAME}-windows.zip" Hexa)
          mkdir -p artifact && mv "Hexa-${GITHUB_REF_NAME}-windows.zip" artifact/
          ls -l artifact
      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: hexa-windows-zip
          path: artifact/*.zip
          if-no-files-found: error

  smoke-windows:
    name: smoke start (Windows)
    needs: export-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hexa-windows-zip
          path: download
      # The exe starts on its main scene (the north Italy map), runs 60 frames headless and must exit with 0.
      - name: Start Hexa.exe
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path download -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath smoke
          $exe = Join-Path (Get-Location) "smoke/Hexa/Hexa.exe"
          # Hexa.exe is a GUI program: wait for it, or PowerShell never sees its exit code.
          $p = Start-Process -FilePath $exe -ArgumentList '--headless', '--quit-after', '60' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "Hexa.exe exited with code $($p.ExitCode)"
            exit 1
          }
          Write-Output "Hexa.exe started and quit with 0."
